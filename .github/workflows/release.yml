name: Cross-Platform Release Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Rust Tests & TypeScript Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run TypeScript check and Vite production build
        run: pnpm build

  release:
    name: Package (${{ matrix.platform }})
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: ubuntu-22.04-arm
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Rust stable & Apple Universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers & bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ScpCraft v__VERSION__'
          releaseBody: 'Automated Windows (.msi/.exe/-portable.zip), macOS Universal (.dmg/.app), and Linux x64 & ARM64 (.deb/.AppImage) builds.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build & upload Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm tauri build --no-bundle --features portable

          $conf = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $conf.version

          $exeCandidates = @(
            "src-tauri/target/release/ScpCraft.exe",
            "src-tauri/target/release/scpcraft.exe"
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exePath) {
            throw "Portable release executable not found in src-tauri/target/release/"
          }

          $stageDir = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $exePath "$stageDir/ScpCraft.exe" -Force

          $zipName = "ScpCraft_${version}_x64-portable.zip"
          Compress-Archive -Path "$stageDir/ScpCraft.exe" -DestinationPath $zipName -Force

          gh release upload "v$version" $zipName --clobber

  sign-release:
    name: Generate & Sign SHA256SUMS
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download release assets, generate SHA256SUMS, and GPG sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          version=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          mkdir -p release-assets
          gh release download "v$version" --dir release-assets --clobber

          cd release-assets
          rm -f SHA256SUMS SHA256SUMS.asc
          LC_ALL=C sha256sum * > SHA256SUMS

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
              printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/gpg-key.asc
            else
              printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > /tmp/gpg-key.asc
            fi

            gpg --batch --import /tmp/gpg-key.asc
            rm -f /tmp/gpg-key.asc

            if [ -n "$GPG_PASSPHRASE" ]; then
              printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
            else
              gpg --batch --yes --pinentry-mode loopback --passphrase "" --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
            fi

            gh release upload "v$version" SHA256SUMS SHA256SUMS.asc --clobber
          else
            echo "::notice::GPG_PRIVATE_KEY secret is not configured; uploading unsigned SHA256SUMS only."
            gh release upload "v$version" SHA256SUMS --clobber
          fi
